<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月面漫游</title>
  <meta name="description" content="驾驶月球车，探索一片安静的月面。电脑浏览器体验。">
  <link rel="stylesheet" href="./moon.css?v=f3f90096980c">
</head>
<body>
  <canvas id="moon" tabindex="0" aria-label="月面驾驶。W S 前进倒车，A D 转向，空格刹车，鼠标拖动观察，R 复位，Esc 暂停。"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div class="mission"><span aria-hidden="true">⌖</span><h1 id="mission-title">观测点</h1><span id="destination-distance"><b id="distance">—</b> m</span></div>
    <div class="header-actions">
      <button id="pause" aria-label="暂停" title="暂停 / 继续 · Esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
      <button id="reset" aria-label="回到着陆区" title="回到着陆区 · R"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
      <button id="help" aria-label="操作与画质" title="操作与画质">?</button>
    </div>
  </header>
  <canvas id="map" width="240" height="240" aria-label="局部地图：箭头为车辆，圆点为目的地"></canvas>
  <div id="beacon" aria-hidden="true">⌖</div>
  <p id="notice" role="status" aria-live="polite"></p>
  <div class="speed"><strong id="speed">0.0</strong><span>km/h</span></div>
  <p id="first-hint">WASD 驾驶 <span>·</span> 鼠标环顾 <span>·</span> 空格刹车</p>
  <div id="loading" class="veil"><div class="intro"><h2>加载月面…</h2><progress id="load-progress" aria-label="正在加载月面"></progress><p id="load-copy"></p></div></div>
  <div id="pause-screen" class="veil" hidden><div class="intro"><button id="resume" class="primary">继续探索 <span>↗</span></button></div></div>
  <dialog id="help-dialog">
    <button id="close-help" aria-label="关闭操作说明">×</button><h2>操作</h2>
    <dl><dt>W / S</dt><dd>前进 / 倒车</dd><dt>A / D</dt><dd>转向</dd><dt>拖动 / 滚轮</dt><dd>环顾 / 远近</dd><dt>空格</dt><dd>刹车</dd><dt>R / Esc</dt><dd>复位 / 暂停</dd></dl>
    <p>抵达观测点，停稳后返回着陆器。</p>
    <label class="quality-choice" for="quality">画质<select id="quality"><option value="auto">自动 · 优先流畅</option><option value="low">流畅</option><option value="high">精细</option></select></label>
    <button id="help-drive" class="primary">返回驾驶 <span>↗</span></button>
  </dialog>
  <div id="desktop-only" class="veil" hidden><div class="intro"><h2>请在电脑上体验</h2><p>需要键盘与鼠标，请放大浏览器窗口。</p></div></div>
  <noscript><div class="veil"><p>请启用 JavaScript 后刷新页面。</p></div></noscript>
  <script defer src="./boot.js?v=f3f90096980c" data-entry="./moon.js?v=f3f90096980c"></script>
</body>
</html>
